name: Field check (Windows)

# Clicks into fields in the Windows app and types there, with the real mouse
# and keyboard (tests/app/field-check.ps1), with and without fMess's page
# script. Runs with the Windows test build: a pull request labelled
# "test build" (again on each push while it has it), or by hand. #51 (a user's
# fields other than the message box took no typing) is why it exists.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'test build')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      - name: Without fMess's page script
        shell: pwsh
        continue-on-error: true
        run: ./tests/app/field-check.ps1 -NoInject
      - name: With fMess's page script
        shell: pwsh
        run: ./tests/app/field-check.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-check
          path: field-check-out/
          retention-days: 7
